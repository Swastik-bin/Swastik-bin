<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <linearGradient id="campSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020705" />
      <stop offset="45%" stop-color="#071710" />
      <stop offset="80%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="tentSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="60%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#0f291e" />
    </linearGradient>
    <linearGradient id="tentFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#091912" />
    </linearGradient>
    <linearGradient id="tentFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <radialGradient id="tentInnerGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffd166" stop-opacity="0.92" />
      <stop offset="75%" stop-color="#f4a261" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1b4332" stop-opacity="0.2" />
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f1c" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#e76f51" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#081c15" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="campMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0" />
      <stop offset="30%" stop-color="#52b788" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#74c69d" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#52b788" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="campFly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#d8f3dc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#52b788" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8f3dc" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#74c69d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#081c15" stop-opacity="0" />
    </radialGradient>
    <g id="pine">
      <polygon points="0,-65 -20,-22 -9,-22 -28,12 -12,12 -34,46 34,46 12,12 28,12 9,-22 20,-22" />
    </g>
    <style>
      .flame-1 { transform-origin: 416px 268px; animation: fOuter 0.85s ease-in-out infinite alternate; }
      .flame-2 { transform-origin: 416px 268px; animation: fMid 0.6s ease-in-out infinite alternate; }
      .flame-3 { transform-origin: 416px 268px; animation: fInner 0.42s ease-in-out infinite alternate; }
      .fire-halo { animation: lanternGlow 1.7s ease-in-out infinite alternate; }
      .lantern-pulse { animation: lanternGlow 2.4s ease-in-out infinite alternate; }
      .type-left { animation: tapLeft 0.16s ease-in-out infinite alternate; }
      .type-right { animation: tapRight 0.19s ease-in-out infinite alternate; }
      .head-nod { animation: nodMove 1.8s ease-in-out infinite alternate; }
      .screen-pulse { animation: screenFlicker 1.1s ease-in-out infinite alternate; }
      .steam-1 { animation: mugSteam1 2.4s ease-out infinite; }
      .steam-2 { animation: mugSteam2 2.4s ease-out infinite 1.2s; }
      .spark-1 { animation: sparkUp1 2.2s ease-out infinite; }
      .spark-2 { animation: sparkUp2 2.7s ease-out infinite 0.7s; }
      .spark-3 { animation: sparkUp3 2.0s ease-out infinite 1.4s; }
      .fire-smoke-1 { animation: fireSmoke 3.8s ease-out infinite; }
      .fire-smoke-2 { animation: fireSmoke 4.4s ease-out infinite 1.9s; }
      .fly-a { animation: flyFloat1 6s ease-in-out infinite, flyBlink 2.3s ease-in-out infinite; }
      .fly-b { animation: flyFloat2 7.5s ease-in-out infinite, flyBlink 3.1s ease-in-out infinite 0.9s; }
      .fly-c { animation: flyFloat1 8.5s ease-in-out infinite 1.2s, flyBlink 2.7s ease-in-out infinite 0.4s; }
      .star-twinkle { animation: starPulse 3.2s ease-in-out infinite alternate; }
      .star-twinkle-2 { animation: starPulse 4.4s ease-in-out infinite alternate 1.6s; }
      @keyframes tapLeft { 0% { transform: translateY(0px); } 100% { transform: translateY(-2px); } }
      @keyframes tapRight { 0% { transform: translateY(-2px); } 100% { transform: translateY(0.5px); } }
      @keyframes nodMove { 0% { transform: translateY(0px); } 100% { transform: translateY(1.2px); } }
      @keyframes screenFlicker { 0% { opacity: 0.75; } 100% { opacity: 1; } }
      @keyframes mugSteam1 { 0% { transform: translate(0px, 2px); opacity: 0; } 35% { opacity: 0.85; } 100% { transform: translate(-2px, -15px); opacity: 0; } }
      @keyframes mugSteam2 { 0% { transform: translate(0px, 2px); opacity: 0; } 35% { opacity: 0.75; } 100% { transform: translate(2px, -17px); opacity: 0; } }
      @keyframes sparkUp1 { 0% { transform: translate(0px, 0px); opacity: 1; } 100% { transform: translate(-12px, -65px); opacity: 0; } }
      @keyframes sparkUp2 { 0% { transform: translate(0px, 0px); opacity: 1; } 100% { transform: translate(14px, -75px); opacity: 0; } }
      @keyframes sparkUp3 { 0% { transform: translate(0px, 0px); opacity: 1; } 100% { transform: translate(-3px, -82px); opacity: 0; } }
      @keyframes fireSmoke { 0% { transform: translate(0px, 0px); opacity: 0; } 25% { opacity: 0.28; } 100% { transform: translate(12px, -68px); opacity: 0; } }
      @keyframes fOuter { 0% { transform: scale(1, 1) skewX(-2deg); } 100% { transform: scale(1.06, 1.12) skewX(3deg); } }
      @keyframes fMid { 0% { transform: scale(1.04, 0.94) skewX(3deg); } 100% { transform: scale(0.95, 1.14) skewX(-3deg); } }
      @keyframes fInner { 0% { transform: scale(0.92, 1.08); } 100% { transform: scale(1.08, 0.94); } }
      @keyframes lanternGlow { 0% { opacity: 0.78; } 100% { opacity: 1; } }
      @keyframes flyFloat1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(16px, -22px); } }
      @keyframes flyFloat2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-20px, -16px); } }
      @keyframes flyBlink { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes starPulse { 0% { opacity: 0.2; } 100% { opacity: 0.95; } }
    </style>
  </defs>

